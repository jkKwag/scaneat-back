server:
  port: 8080

spring:
  application:
    name: scaneat-back
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        # 스키마 자동 생성 중 특정 테이블에서 에러가 나도(예: 컬럼 불일치) 그 에러만 로그로
        # 남기고 나머지 스키마 반영은 계속 진행 — 무관한 테이블 문제로 기동 전체가 죽지 않게 함.
        hbm2ddl:
          halt_on_error: false
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

toss:
  secret-key: ${TOSS_SECRET_KEY}
  base-url: https://api.tosspayments.com

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-latest
  base-url: https://generativelanguage.googleapis.com/v1beta

r2:
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  endpoint-url: ${R2_ENDPOINT_URL}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

nts:
  service-key: ${NTS_SERVICE_KEY}
  base-url: https://api.odcloud.kr/api/nts-businessman/v1

aws:
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    region: ${AWS_SES_REGION}
    from-address: ${AWS_SES_FROM_ADDRESS}

logging:
  level:
    com.scaneat.back: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
