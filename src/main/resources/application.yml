server:
  port: 8080

spring:
  application:
    name: scaneat-back
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

toss:
  secret-key: ${TOSS_SECRET_KEY}
  base-url: https://api.tosspayments.com

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-latest
  base-url: https://generativelanguage.googleapis.com/v1beta

supabase:
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  base-url: https://zhtqkjorhhqnnhgsddmn.supabase.co

nts:
  service-key: ${NTS_SERVICE_KEY}
  base-url: https://api.odcloud.kr/api/nts-businessman/v1

aws:
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    region: ${AWS_SES_REGION}
    from-address: ${AWS_SES_FROM_ADDRESS}

logging:
  level:
    com.scaneat.back: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
