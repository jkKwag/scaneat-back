server:
  port: 8080

spring:
  application:
    name: scaneat-back
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 자동 컬럼/테이블 생성 재시도 — halt_on_error=false와 함께 실제로 기동 실패 없이
      # 동작하는지 테스트 중. 문제가 재현되면 none으로 원복할 것.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        hbm2ddl:
          halt_on_error: false
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:jkscaneat.com}
    rp-name: JK Scaneat
    origin: ${WEBAUTHN_ORIGIN:https://www.jkscaneat.com}

kakao:
  # 기본값을 비워둬서, 이 값들이 EC2에 아직 등록 안 됐어도 앱 전체가 기동 실패하지 않게 한다 —
  # 카카오 로그인 자체만 (호출 시점에) 인증 실패로 처리되고, 다른 기능은 정상 동작한다.
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:https://www.jkscaneat.com/admin/kakao/callback}
  auth-base-url: https://kauth.kakao.com
  api-base-url: https://kapi.kakao.com

toss:
  secret-key: ${TOSS_SECRET_KEY}
  base-url: https://api.tosspayments.com

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-latest
  base-url: https://generativelanguage.googleapis.com/v1beta

r2:
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  endpoint-url: ${R2_ENDPOINT_URL}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

nts:
  service-key: ${NTS_SERVICE_KEY}
  base-url: https://api.odcloud.kr/api/nts-businessman/v1

push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: mailto:admin@jkscaneat.com

aws:
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    region: ${AWS_SES_REGION}
    from-address: ${AWS_SES_FROM_ADDRESS}

logging:
  level:
    com.scaneat.back: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
