server:
  port: 8080

spring:
  application:
    name: scaneat-back
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 기존 update는 시작 시 스키마 불일치(컬럼 NOT NULL 추가 실패 등)가 있으면 그 테이블과
      # 무관한 기능까지 포함해 애플리케이션 전체가 기동을 못 하는 위험이 있었다 — none으로
      # 바꿔 앱은 항상 뜨게 하고, 이제부터 스키마 변경(컬럼/테이블 추가 등)은 수동으로 반영한다.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    show-sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

toss:
  secret-key: ${TOSS_SECRET_KEY}
  base-url: https://api.tosspayments.com

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-flash-latest
  base-url: https://generativelanguage.googleapis.com/v1beta

r2:
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  endpoint-url: ${R2_ENDPOINT_URL}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

nts:
  service-key: ${NTS_SERVICE_KEY}
  base-url: https://api.odcloud.kr/api/nts-businessman/v1

aws:
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    region: ${AWS_SES_REGION}
    from-address: ${AWS_SES_FROM_ADDRESS}

logging:
  level:
    com.scaneat.back: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
